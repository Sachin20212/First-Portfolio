<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Portfolio" content="Web_development-Life, initial-scale=1.0">
    <link rel="Icon" type="image/png" href="/image/logo/paint.png">   
    <title>Sachin Portfolio</title>
    <style>
        *{margin: 0; padding: 0;
          text-decoration: none;
          box-sizing: border-box;
          outline: none;
          border: none;}

        html{
            font-size: 62.5%;
        }

        body{
            background-color: black;
            color: wheat;
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
        }
        header{
            margin-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 9%;
            background-color: transparent;
            filter: drop-shadow(10px);  
            display: flex;
            justify-content: space-between;
            text-align: center;
            z-index: 100;          
        } 

        .logo{
            font-size: 3rem ;
            color: #b74b4b;
            font-weight: 800;
            cursor: pointer;
            transition: 0.5s ease;
        }
        .logo:hover{
            transform: scale(1.1);
        }
        nav ul li {
            display: inline-block;
            animation: showbarsmove all 0.6s ease-in;
        }
         @keyframes showbarsmove{
            0%, 30%{
                scale: 0.1;
            }
            31%, 60%{
                scale: 0.6;
            }
            61%, 100%{
                scale: 1.2;
            }
        }
        nav ul li a, 
        nav ul li a img{
            font-size: 1.8rem;
            color: white;
            margin-left: 4rem;
            font-weight: 500;
            transition: 0.3s ease;
        }
        nav ul li a:hover,
        nav ul li a:active{
            color: #b74b4b;
            border-bottom: 3px solid #b74b4b;
        }
        nav ul li a img{
            display: none;
        }
        .sidebar{
            position: fixed;
            display: none;
            flex-direction: column;
            top: 0;
            right: 0;
            height: 100vh;
            width: 250px;
            z-index: 999;
            background-color: rgb(50, 48, 48);
            backdrop-filter: blur(10px);
            box-shadow: -10px 0 10px rgba(73, 68, 68, 0.77);
            align-items: center;
            justify-content: flex-start;
            animation: outbarmove all 0.6 ease-in;
        }
         @keyframes outbarmove{
            0%, 30%{
                scale: 0.1;
            }
            31%, 60%{
                scale: 0.6;
            }
            61%, 100%{
                scale: 1.2;
            }
        }
        .sidebar li{
            margin-top: 12%;
            width: 100%;
        }
        .sidebar a{
            width: 100%;
        }

        @media (max-width:1090px) {
            nav ul li a img{
            display: flex;
            }
            .hiddenbar{
                display: none;
            }
            
        }

        section{
            min-height: 100vh;
            padding: 5rem 9% 5rem;
        }

        .home{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8rem;
            background-color: black;
        }
        .home .home-content{
            font-size: 6rem;
            font-weight: 700;
            line-height: 1.3;
        }
        span{
            color: #b74b4b;
        }

        .home-content h3{
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .home_img{
            border-radius: 50%;
        }
        .home_img img{
            width: 32vw 38vw;
            border-radius: 50%;
            box-shadow: 0 0 25px solid #b74b4b;
            cursor: pointer;
            transition: 0.2s linear;
        }
        .home_img img:hover{
            font-size: 1.8rem 2.2rem;
            font-weight: 500;
        } 
        
        
        .social-icons a img {
            display: inline-block;
            justify-content: center;
            align-items: center;
            width: 4rem;
            height: 4rem;
            color: #b74b4b ;
            background-color: white;
            border: 2px solid #b74b4b;
            font-size: 2rem;
            border-radius: 50%;
            margin: 3rem 1.5rem 3rem 0;
            transition: 0.3s ease;
        }
        .social-icons a img:hover{
            color: black;
            transform: scale(1.3) translateY(-5px);
            box-shadow: 0 0 25px #b74b4b;
        }

        .Btn{
            display: inline-block;
            padding: 1rem 2.8rem;
            background-color: black;
            border-radius: 4rem;
            font-size: 1.6rem;
            color: #b74b4b;
            letter-spacing: 0.3;
            font-weight: 600;
            border: 2px solid #b74b4b;
            transition: 0.3s ease;
            cursor: pointer;
        }
        .Btn:hover{
            transform: scale3d(1.03);
            background-color: #b74b4b;
            color: black;
            box-shadow: 0 0 25px #b74b4b;
        } 

        .typing-text{
            font-size: 34px;
            font-weight: 600;
            min-width: 280px;
        }
        .typing-text span{
            position: relative;
        }
        .typing-text span::before{
            content: "Front-End Development";
            color: #b74b4b;
            animation: words 20s infinite;
        }
        .typing-text span::after{
            content: "";
            background-color: black;
            position: absolute;
            width: calc(100% + 8px);
            height: 100%;
            border-left: 3px solid black;
            right: -8;
            animation: cursor 0.6s infinite;
        }

        @keyframes cursor{
            to{
                border-left: 3px solid #b74b4b;
            }
        }

        @keyframes words{
            0%, 20%{
                content: "Web Development";
            }
            21%, 40%{
                content: "Development";
            }
            41%, 60%{
                content: "Web Designer";
            }
            61%, 80%{
                content: "WordPress";
            }
            81%, 100%{
                content: "MS-Excel";
            }
        }

        @media (max-width:1000px){
            .home{
                gap: 4rem;
            }
        }
        @media (max-width:995px) {
            .home{
                flex-direction: column;
                margin: 5rem 4rem;
            }
            
            .home .home-content h3{
                font-size: 2.5rem;
            }

            .home-content h1{
                font-size: 5rem;
            }

            .home_img img{
                width: 70vw;
                margin-top:4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="" class="logo">Sachin</a>

        <nav>
            <ul class="sidebar">
                <li onclick="closedbar()"><a href="#"><img src="/image/Assts/x-solid.png" alt="Close" height="48px" width="48px" style="background-color: white;"></a></li>
                <li><a href="/index.html" class="active">Home</a></li>
                <li><a href="">Services</a></li>
                <li><a href="/Certifications-list.html">Certifications list</a></li>
                <li><a href="/Skills-page.html">Skills list</a></li>
                <li><a href="/Education.html">Education</a></li>
                <li><a href="">Experience</a></li>
                <li><a href="/Contact.html">Contact</a></li>
            </ul>
            <ul>
                <li class="hiddenbar"><a href="/index.html" class="active">Home</a></li>
                <li class="hiddenbar"><a href="">Services</a></li>
                <li class="hiddenbar"><a href="/Certifications-list.html">Certifications list</a></li>
                <li class="hiddenbar"><a href="/Skills-page.html">Skills list</a></li>
                <li class="hiddenbar"><a href="/Education.html">Education</a></li>
                <li class="hiddenbar"><a href="">Experience</a></li>
                <li class="hiddenbar"><a href="/Contact.html">Contact</a></li>
                <li onclick="showBarmenu()"><a href="#"><img src="/image/Assts/bars-solid.png" height="65px" width="70px" ></a></li>
            </ul>
        </nav>
    </header>
    <section class="home">
        <div class="home_img">
            <img src="/image/logo/paint.png" alt="Ower">
        </div>
        <div class="home-content">
            <h1>Hi, it's <span>Sachin</span></h1>
            <h3 class="typing-text">I'm a <span></span></h3>
            <p>current I am a student of 1 year Bca AIML.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/sachin-upadhyay-1a0660419/" target="_blank"><img src="/image/Social Media logo/linkedin-brands-solid.png" alt="Linkedin"></a>
                <a href="#"><img src="/image/Social Media logo/github-brands-solid.png" alt="Github"></a>                
                <a href="#"><img src="/image/Social Media logo/instagram-brands-solid.png" alt="Instagram"></a>
                <a href="#"><img src="/image/Social Media logo/x-twitter-brands-solid.png" alt="Twitter"></a>
            </div>
            <a href="" class="Btn">Hire me</a>
        </div>
    </section>
    <script>
        function showBarmenu(){
            const sidebar = document.querySelector('.sidebar')
                  sidebar.style.display = 'flex'
        }

        function closedbar(){
            const outbar = document.querySelector('.sidebar')
                  outbar.style.display = 'none'
        }
    </script>
</body>
</html>
